<svg xmlns="http://www.w3.org/2000/svg" width="790" height="870" viewBox="0 0 790 870">
<!-- riso-illustration starter. Copy, rename, replace the placeholder shapes, keep the layer order.
     The filter library is inlined by scripts/render.mjs at this marker: -->
<!-- riso:defs -->
<defs>
  <!-- HERO silhouette: define once, reuse for clip, base fill, dot screen, edge shading -->
  <path id="hero" d="M60 150 H460 V780 H60 Z"/>
  <clipPath id="heroClip"><use href="#hero"/></clipPath>
  <!-- tone gradients: colour = the DOT colour, stop-opacity = tone -->
  <linearGradient id="heroDeep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0.45" stop-color="#033F50" stop-opacity="0"/><stop offset="1" stop-color="#033F50" stop-opacity="0.75"/>
  </linearGradient>
  <linearGradient id="heroFoot" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0.82" stop-color="#022C3A" stop-opacity="0"/><stop offset="1" stop-color="#022C3A" stop-opacity="0.9"/>
  </linearGradient>
  <linearGradient id="greyShade" x1="0.2" y1="0" x2="0.6" y2="1">
    <stop offset="0.1" stop-color="#4A4A4A" stop-opacity="0"/><stop offset="0.6" stop-color="#4A4A4A" stop-opacity="0.32"/><stop offset="1" stop-color="#4A4A4A" stop-opacity="0.7"/>
  </linearGradient>
  <linearGradient id="wedge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4A4A4A" stop-opacity="0.85"/><stop offset="1" stop-color="#4A4A4A" stop-opacity="0.05"/>
  </linearGradient>
</defs>

<!-- 1. background: flat paper, never textured -->
<rect width="790" height="870" fill="#F3F5F9"/>

<g filter="url(#riso-grain)">
  <!-- 2. HERO (green) -->
  <use href="#hero" x="-5" y="-4" fill="#CFEAF1" filter="url(#riso-rough)"/>               <!-- misregistration sliver -->
  <g clip-path="url(#heroClip)">
    <use href="#hero" fill="#05556C" filter="url(#riso-rough)"/>                           <!-- base fill -->
    <rect x="60" y="150" width="400" height="630" fill="url(#heroDeep)"/>                    <!-- deepen bottom-right -->
    <use href="#hero" fill="#022C3A" fill-opacity="0.34" filter="url(#riso-ht)"/>          <!-- base dot screen -->
    <g transform="rotate(-35 260 465)">                                                      <!-- dry-brush direction -->
      <rect x="-160" y="100" width="840" height="760" fill="#17BAE8" opacity="0.62" filter="url(#riso-drybrush)"/>
      <rect x="-160" y="100" width="840" height="760" fill="#E4F7EE" opacity="0.4" filter="url(#riso-ridges)"/>
    </g>
    <use href="#hero" fill="#022C3A" filter="url(#riso-edge-ht)"/>                         <!-- edge halftone (bottom/right) -->
    <rect x="60" y="650" width="400" height="130" fill="url(#heroFoot)" filter="url(#riso-ht-coarse)"/>
  </g>
  <!-- lighter translucent layer (mint) -->
  <!-- <path d="..." fill="#8ED6E8" fill-opacity="0.82" filter="url(#riso-rough)"/> -->
  <!-- solid dark element (opaque forest) -->
  <rect x="130" y="210" width="120" height="120" fill="#9FDDF0" filter="url(#riso-rough)"/>
  <!-- text / level lines -->
  <g stroke="#9FDDF0" stroke-width="5.5" stroke-linecap="round" fill="none" filter="url(#riso-line)">
    <path d="M110 430 H300 M110 570 H420 M110 710 H400"/>
  </g>

  <!-- 3. SECONDARY (warm grey-white). Author in canvas coordinates; rotate around a canvas point. -->
  <g transform="rotate(-30 600 600)">
    <!-- <path id="obj2" d="..." fill="#EAE9E6" filter="url(#riso-crumple)"/>            base + crumple
         <path d="(same)" fill="#4A4A4A" fill-opacity="0.2" filter="url(#riso-ht)"/>   light dot screen
         <path d="(same)" fill="url(#greyShade)" filter="url(#riso-ht-fine)"/>         shadow side
         <path d="wedge beside a contour" fill="url(#wedge)" filter="url(#riso-ht-fine)"/>
         <g stroke="#383838" stroke-width="2.6" stroke-linecap="round" fill="none" filter="url(#riso-line)"> 2–4 short fold lines </g> -->
  </g>

  <!-- 4. COBALT accent object: base stroke/shape + darker halftone on its right side + one light highlight line -->
  <!-- <path d="..." stroke="#17BAE8" stroke-width="24" fill="none" stroke-linecap="round" filter="url(#riso-rough)"/> -->

  <!-- 5. THE ONE LIME LINE: from the interaction point, 1–2 loops, exits past the hero's top edge -->
  <!-- <path d="..." fill="none" stroke="#FFCB52" stroke-width="3.4" stroke-linecap="round" filter="url(#riso-line)"/> -->
</g>
</svg>
