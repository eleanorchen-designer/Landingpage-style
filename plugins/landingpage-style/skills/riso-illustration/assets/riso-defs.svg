    <feImage x="0" y="0" width="5" height="5" preserveAspectRatio="none" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%275%27%20height%3D%275%27%3E%3Cdefs%3E%3CradialGradient%20id%3D%27g%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23fff%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23000%27%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%275%27%20height%3D%275%27%2F%3E%3Cg%20style%3D%27mix-blend-mode%3Alighten%27%3E%3Ccircle%20cx%3D%272.5%27%20cy%3D%272.5%27%20r%3D%272.5%27%20fill%3D%27url(%23g)%27%2F%3E%3Ccircle%20cx%3D%270%27%20cy%3D%270%27%20r%3D%272.5%27%20fill%3D%27url(%23g)%27%2F%3E%3Ccircle%20cx%3D%275%27%20cy%3D%270%27%20r%3D%272.5%27%20fill%3D%27url(%23g)%27%2F%3E%3Ccircle%20cx%3D%270%27%20cy%3D%275%27%20r%3D%272.5%27%20fill%3D%27url(%23g)%27%2F%3E%3Ccircle%20cx%3D%275%27%20cy%3D%275%27%20r%3D%272.5%27%20fill%3D%27url(%23g)%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" result="cell"/>
    <feTile in="cell" result="screen"/>
