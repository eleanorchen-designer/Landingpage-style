  </filter>

  <!-- riso-edge-ht: draw a COPY of a shape in the dot colour with this filter.
       It prints halftone dots only along the inner edges, heaviest on the bottom-right
       (light comes from the top-left). -->
  <filter id="riso-edge-ht" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="b"/>
    <feOffset in="b" dx="-16" dy="-18" result="bo"/>
